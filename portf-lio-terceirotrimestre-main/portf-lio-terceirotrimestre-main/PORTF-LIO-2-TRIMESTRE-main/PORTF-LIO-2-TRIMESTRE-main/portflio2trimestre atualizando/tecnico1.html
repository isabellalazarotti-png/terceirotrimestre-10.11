<!DOCTYPE html>

<head>

    <title>Matérias Técnico</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #000 !important; color: white; margin: 0; padding: 0; font-family: sans-serif; }
        header { background-color: #000; padding: 40px 60px; }
        .container-central { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; padding: 40px 0; }
        .card {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 60px 30px;
            width: 320px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }
        .card:hover { border-color: #a282ff; transform: scale(1.02); }
        .card h2 { font-family: serif; font-size: 24px; margin-bottom: 15px; }
        .card p { color: #555; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }
        .ativo { border-color: #a282ff; }
        .ativo p { color: #a282ff; font-weight: bold; }
        .alinhamento-esquerda { padding: 0 60px; text-align: left; }
        .titulo-pagina { font-size: 55px; font-family: serif; margin: 40px 0; }
        .titulo-pagina span { color: #a282ff; font-style: italic; }
    </style>
</head>
